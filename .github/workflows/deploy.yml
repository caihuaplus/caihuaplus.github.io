name: Deploy Astro blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site source
        uses: actions/checkout@v7
      - name: Set up Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: '24'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
